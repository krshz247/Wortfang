<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wortschatz</title>
<meta name="description" content="Personal German vocabulary tracker — nouns and verbs with full grammar.">
<meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wortschatz">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f4ee;
  --surface: #ffffff;
  --surface-2: #f0ece4;
  --ink: #1c1917;
  --muted: #6f6861;
  --line: #e4ded3;
  --accent: #1c1917;
  --accent-ink: #f7f4ee;
  --danger: #b42318;
  --der: #1d5fd1;  --der-bg: #e3ecfb;
  --die: #b8235a;  --die-bg: #f9e3ec;
  --das: #1b7a3f;  --das-bg: #e0f1e6;
  --shadow: 0 1px 2px rgba(28,25,23,.06), 0 2px 8px rgba(28,25,23,.04);
  --radius: 14px;
  --serif: "Fraunces", Georgia, "Times New Roman", serif;
  --sans: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141312;
    --surface: #1e1c1a;
    --surface-2: #272421;
    --ink: #f3efe8;
    --muted: #a39c94;
    --line: #34302b;
    --accent: #f3efe8;
    --accent-ink: #141312;
    --danger: #f97066;
    --der: #7aa7f5;  --der-bg: #1b2a44;
    --die: #f07aa6;  --die-bg: #3d1b29;
    --das: #6fcf93;  --das-bg: #173323;
    --shadow: none;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.45 var(--sans);
  padding: env(safe-area-inset-top) 0 0;
  min-height: 100vh; min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

/* ---------- header & controls ---------- */
.top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 6px; max-width: 720px; margin: 0 auto;
}
.brand h1 { font: 650 30px/1.1 var(--serif); margin: 0; letter-spacing: -.01em; }
.brand .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.icon-btn {
  width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; padding: 0;
}
.icon-btn svg { width: 20px; height: 20px; }
.controls {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: 8px 16px 10px; max-width: 720px; margin: 0 auto;
}
.seg {
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px;
  background: var(--surface-2); border-radius: 12px;
}
.seg button {
  border: 0; background: transparent; padding: 9px 8px; border-radius: 9px;
  font-weight: 500; color: var(--muted);
}
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg .n { font-variant-numeric: tabular-nums; opacity: .7; font-weight: 400; margin-left: 4px; }
.searchrow { display: flex; gap: 8px; margin-top: 10px; }
.searchrow input {
  flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); font-size: 16px;
}
.searchrow select {
  padding: 10px 8px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); font-size: 15px;
}

/* ---------- list ---------- */
main { max-width: 720px; margin: 0 auto; padding: 4px 16px calc(110px + env(safe-area-inset-bottom)); }
.card {
  display: block; width: 100%; text-align: left; border: 1px solid var(--line);
  background: var(--surface); border-radius: var(--radius); padding: 13px 14px;
  margin-bottom: 8px; box-shadow: var(--shadow);
}
.card:active { transform: scale(.99); }
.card .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.word { font: 500 21px/1.2 var(--serif); }
.pill {
  font: 600 12px/1 var(--sans); letter-spacing: .02em; padding: 4px 7px;
  border-radius: 6px; text-transform: lowercase; align-self: center;
}
.pill.der { color: var(--der); background: var(--der-bg); }
.pill.die { color: var(--die); background: var(--die-bg); }
.pill.das { color: var(--das); background: var(--das-bg); }
.art-der { color: var(--der); } .art-die { color: var(--die); } .art-das { color: var(--das); }
.plural { color: var(--muted); font-size: 14px; }
.meaning { margin-top: 3px; font-size: 15px; }
.forms { margin-top: 4px; color: var(--muted); font-size: 13.5px; }
.empty { text-align: center; color: var(--muted); padding: 48px 12px; }
.empty strong { display: block; color: var(--ink); font: 500 20px/1.3 var(--serif); margin-bottom: 6px; }

.fab {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 6;
  border: 0; border-radius: 999px; padding: 14px 22px;
  background: var(--accent); color: var(--accent-ink); font-weight: 600;
  box-shadow: 0 6px 20px rgba(0,0,0,.18); display: flex; align-items: center; gap: 8px;
}
.fab svg { width: 18px; height: 18px; }

/* ---------- sheet ---------- */
.backdrop {
  position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.35);
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  width: 100%; max-width: 720px; max-height: calc(100dvh - env(safe-area-inset-top) - 24px);
  background: var(--bg); border-radius: 18px 18px 0 0; display: flex; flex-direction: column;
  animation: up .18s ease-out;
}
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (min-width: 760px) {
  .backdrop { align-items: center; }
  .sheet { border-radius: 18px; max-height: 88vh; }
}
.sheet-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 14px 16px 10px; border-bottom: 1px solid var(--line);
}
.sheet-head h2 { margin: 0; font: 600 18px/1.2 var(--sans); }
.sheet-body {
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
}
.textbtn { border: 0; background: none; color: var(--muted); padding: 8px 4px; font-weight: 500; }

/* ---------- detail ---------- */
.headword { font: 650 34px/1.1 var(--serif); margin: 2px 0 6px; word-break: break-word; }
.headword .art { font-weight: 500; }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; margin: 12px 0; font-size: 15px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.example {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px; margin: 12px 0;
}
.example .de { font: 500 17px/1.4 var(--serif); }
.example .en { color: var(--muted); font-size: 14px; margin-top: 4px; }
.note { font-size: 14px; color: var(--muted); border-left: 3px solid var(--line); padding: 2px 0 2px 10px; margin: 12px 0; }
.tagrow { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 8px; }
.tag { font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.conj { width: 100%; border-collapse: collapse; font-size: 14.5px; margin: 10px 0 4px; }
.conj th, .conj td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.conj thead th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.conj tbody th { color: var(--muted); font-weight: 500; white-space: nowrap; width: 1%; }
.conj-wrap { overflow-x: auto; }
.meta { color: var(--muted); font-size: 12.5px; margin-top: 16px; }
.actions { display: flex; gap: 8px; margin-top: 18px; }
.btn {
  flex: 1; border-radius: 12px; padding: 12px 14px; font-weight: 600;
  border: 1px solid var(--line); background: var(--surface);
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn:disabled { opacity: .5; }

/* ---------- forms ---------- */
.field { margin-bottom: 14px; }
.field label, .lbl { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
.field input[type=text], .field input[type=password], .field input:not([type]), .field textarea, .field select {
  width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); font-size: 16px;
}
.field textarea { resize: vertical; min-height: 64px; }
.field .hint { font-size: 12.5px; color: var(--muted); margin-top: 5px; }
.choice { display: flex; gap: 6px; flex-wrap: wrap; }
.choice label {
  display: inline-flex; align-items: center; gap: 6px; margin: 0; padding: 9px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 15px; font-weight: 500;
}
.choice input { accent-color: var(--ink); margin: 0; }
.choice label:has(input:checked) { border-color: var(--ink); }
.choice label.der:has(input:checked) { color: var(--der); border-color: var(--der); background: var(--der-bg); }
.choice label.die:has(input:checked) { color: var(--die); border-color: var(--die); background: var(--die-bg); }
.choice label.das:has(input:checked) { color: var(--das); border-color: var(--das); background: var(--das-bg); }
.grid-forms { display: grid; grid-template-columns: auto 1fr 1fr; gap: 6px 8px; align-items: center; }
.grid-forms .h { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.grid-forms .p { color: var(--muted); font-size: 14px; white-space: nowrap; }
.grid-forms input { width: 100%; min-width: 0; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; }
.section-title { font: 500 19px/1.2 var(--serif); margin: 22px 0 10px; }
.error { color: var(--danger); font-size: 14px; margin: 8px 0; }

/* ---------- ask claude ---------- */
.tabs2 { margin-bottom: 16px; }
.askrow { display: flex; gap: 8px; }
.askrow input { flex: 1; min-width: 0; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 17px; }
.askrow .btn { flex: 0 0 auto; }
.status { display: flex; align-items: center; gap: 10px; color: var(--muted); margin: 16px 0; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--ink); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.flag {
  background: var(--surface-2); border-radius: 12px; padding: 11px 13px; font-size: 14.5px; margin: 14px 0;
}
.cand { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 14px; margin: 10px 0; }
.choice.senses { flex-direction: column; }
.choice.senses label { align-items: flex-start; font-weight: 400; font-size: 14.5px; line-height: 1.35; }
.choice.senses input { margin-top: 3px; }
.card .tag { align-self: center; }
.cand .why { font-size: 13.5px; color: var(--muted); margin-top: 4px; }
.cand .actions { margin-top: 12px; }
.dup { font-size: 13px; color: var(--danger); margin-top: 6px; }

/* ---------- settings ---------- */
.setting-block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.setting-block h3 { margin: 0 0 10px; font: 600 15px/1.2 var(--sans); }
.setting-block p { margin: 0 0 10px; font-size: 14px; color: var(--muted); }
.inline { display: flex; gap: 8px; }
.inline input { flex: 1; min-width: 0; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 40;
  bottom: calc(84px + env(safe-area-inset-bottom));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px;
  font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.2);
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>Wortschatz</h1>
    <div class="sub" id="subline">Loading…</div>
  </div>
  <button class="icon-btn" id="btnSettings" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<div class="controls">
  <div class="seg" role="tablist">
    <button role="tab" data-tab="noun" aria-selected="true">Nomen<span class="n" id="nNoun"></span></button>
    <button role="tab" data-tab="verb" aria-selected="false">Verben<span class="n" id="nVerb"></span></button>
  </div>
  <div class="searchrow">
    <input id="search" type="search" placeholder="Search German or English" autocomplete="off" autocapitalize="off" spellcheck="false">
    <select id="sort" aria-label="Sort">
      <option value="az">A–Z</option>
      <option value="new">Newest</option>
    </select>
  </div>
</div>

<main id="list" aria-live="polite"></main>

<button class="fab" id="fab">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  Add word
</button>

<div class="backdrop" id="backdrop" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button class="textbtn" id="sheetClose">Close</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
/* =========================================================
   Constants
   ========================================================= */
const SCHEMA_VERSION = 2;
const PERSONS = ["ich", "du", "er", "wir", "ihr", "sie"];
const PERSON_LABEL = { ich: "ich", du: "du", er: "er/sie/es", wir: "wir", ihr: "ihr", sie: "sie/Sie" };
// Perfekt is derived at display time — the two auxiliaries never change.
const AUX = {
  haben: { ich: "habe", du: "hast", er: "hat", wir: "haben", ihr: "habt", sie: "haben" },
  sein:  { ich: "bin",  du: "bist", er: "ist", wir: "sind",  ihr: "seid", sie: "sind" },
};
const REFL = { ich: "mich", du: "dich", er: "sich", wir: "uns", ihr: "euch", sie: "sich" };
const MODELS = [
  { id: "claude-sonnet-5", label: "Claude Sonnet 5 — recommended" },
  { id: "claude-haiku-4-5-20251001", label: "Claude Haiku 4.5 — cheapest, fastest" },
  { id: "claude-opus-5", label: "Claude Opus 5 — most careful, pricier" },
];
const DEFAULT_MODEL = MODELS[0].id;

const nowISO = () => new Date().toISOString();
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() :
  "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16);
  }));
const emptyForms = () => Object.fromEntries(PERSONS.map(p => [p, ""]));

/* Seed: the prototype's 5 entries, migrated to schema v2.
   Changes vs. prototype: stable ids, plural split from its note, meaning split from note,
   perfektAux as a list, separable/reflexive flags, and a corrected Wasser plural note. */
const SEED = [
  { type: "noun", article: "der", word: "Apfel", plural: "Äpfel", pluralNote: "", meaning: "apple", note: "",
    example: "Ich esse einen Apfel.", exampleEn: "I eat an apple." },
  { type: "noun", article: "der", word: "Arztbericht", plural: "Arztberichte", pluralNote: "", meaning: "medical report",
    note: "Related: der Befund / Befundbericht = (medical) findings; der Arztbrief = letter from one doctor to another.",
    example: "Der Arzt hat einen ausführlichen Arztbericht geschrieben.", exampleEn: "The doctor wrote a detailed medical report." },
  { type: "noun", article: "der", word: "Bericht", plural: "Berichte", pluralNote: "", meaning: "report", note: "",
    example: "Er hat einen Bericht über das Projekt geschrieben.", exampleEn: "He wrote a report about the project." },
  { type: "noun", article: "das", word: "Wasser", plural: null,
    pluralNote: "Usually uncountable. Plural „Wässer“ for kinds of water (Mineralwässer, Abwässer); „Wasser“ as plural for bodies of water.",
    meaning: "water", note: "",
    example: "Ich trinke ein Glas Wasser.", exampleEn: "I drink a glass of water." },
  { type: "verb", infinitive: "wandern", meaning: "to hike", note: "Also: to wander, to ramble.",
    praesens: { ich: "wandere", du: "wanderst", er: "wandert", wir: "wandern", ihr: "wandert", sie: "wandern" },
    praeteritum: { ich: "wanderte", du: "wandertest", er: "wanderte", wir: "wanderten", ihr: "wandertet", sie: "wanderten" },
    perfektAux: ["sein"], partizip: "gewandert", separable: false, reflexive: false,
    example: "Wir sind am Wochenende gewandert.", exampleEn: "We went hiking over the weekend." },
];

/* =========================================================
   Storage — IndexedDB (entries) + localStorage (settings)
   ========================================================= */
const DB = (() => {
  let dbp;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((resolve, reject) => {
      const req = indexedDB.open("wortschatz", 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains("entries")) db.createObjectStore("entries", { keyPath: "id" });
        if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta");
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbp;
  }
  async function tx(store, mode, fn) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const t = db.transaction(store, mode);
      const s = t.objectStore(store);
      let result;
      Promise.resolve(fn(s)).then(r => { result = r; });
      t.oncomplete = () => resolve(result);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error);
    });
  }
  const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  return {
    all: () => tx("entries", "readonly", s => reqP(s.getAll())),
    put: e => tx("entries", "readwrite", s => { s.put(e); }),
    putMany: list => tx("entries", "readwrite", s => { list.forEach(e => s.put(e)); }),
    del: id => tx("entries", "readwrite", s => { s.delete(id); }),
    getMeta: k => tx("meta", "readonly", s => reqP(s.get(k))),
    setMeta: (k, v) => tx("meta", "readwrite", s => { s.put(v, k); }),
  };
})();

const Settings = {
  get(k, d) { try { const v = localStorage.getItem("wz." + k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { if (v === null || v === "") localStorage.removeItem("wz." + k); else localStorage.setItem("wz." + k, v); } catch {} },
};

/* =========================================================
   Normalisation / validation
   ========================================================= */
const str = v => (typeof v === "string" ? v.trim() : "");
function normalize(raw, { keepMeta = true } = {}) {
  const t = raw.type ? (raw.type === "verb" ? "verb" : "noun") : (raw.infinitive ? "verb" : "noun");
  const base = {
    id: keepMeta && raw.id ? String(raw.id) : uuid(),
    type: t,
    meaning: str(raw.meaning),
    note: str(raw.note),
    example: str(raw.example),
    exampleEn: str(raw.exampleEn),
    source: raw.source || "manual",
    createdAt: keepMeta && raw.createdAt ? raw.createdAt : nowISO(),
    updatedAt: keepMeta && raw.updatedAt ? raw.updatedAt : nowISO(),
  };
  if (t === "noun") {
    const art = ["der", "die", "das"].includes(raw.article) ? raw.article : "";

/* =========================================================
   List rendering
   ========================================================= */
async function load() {
  if (!(await DB.getMeta("seeded"))) {
    const t = nowISO();
    await DB.putMany(SEED.map(s => normalize({ ...s, source: "seed", createdAt: t, updatedAt: t }, { keepMeta: false })));
    await DB.setMeta("seeded", true);
  }
  state.entries = await DB.all();
  render();
}

function render() {
  const nouns = state.entries.filter(e => e.type === "noun");
  const verbs = state.entries.filter(e => e.type === "verb");
  $("#nNoun").textContent = nouns.length;
  $("#nVerb").textContent = verbs.length;
  $("#subline").textContent = `${state.entries.length} ${state.entries.length === 1 ? "word" : "words"} · Deutsch ↔ English`;
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)));
  $("#sort").value = state.sort;

  let list = state.tab === "noun" ? nouns : verbs;
  const q = fold(state.q.trim());
  if (q) {
    list = list.filter(e => {
      const hay = [headOf(e), e.meaning, e.note, e.plural, e.partizip,
        ...(e.type === "verb" ? [...Object.values(e.praesens), ...Object.values(e.praeteritum)] : [])].map(fold).join(" ");
      return hay.includes(q);
    });
  }
  list = [...list].sort(state.sort === "new"
    ? (a, b) => (b.createdAt || "").localeCompare(a.createdAt || "")
    : (a, b) => collator.compare(headOf(a).replace(/^sich\s+/i, ""), headOf(b).replace(/^sich\s+/i, "")));

  const el = $("#list");
  if (!list.length) {
    el.innerHTML = q
      ? `<div class="empty"><strong>No match</strong>Nothing for “${esc(state.q)}”. Tap <b>Add word</b> to look it up.</div>`
      : `<div class="empty"><strong>No ${state.tab === "noun" ? "nouns" : "verbs"} yet</strong>Tap <b>Add word</b> to start.</div>`;
    return;
  }
  el.innerHTML = list.map(e => e.type === "noun" ? `
    <button class="card" data-id="${esc(e.id)}">
      <div class="head">
        <span class="pill ${esc(e.article)}">${esc(e.article)}</span>
        <span class="word">${esc(e.word)}</span>
        <span class="plural">${e.plural ? `· die ${esc(e.plural)}` : "· no plural"}</span>
      </div>
      <div class="meaning">${esc(e.meaning)}</div>
    </button>` : `
    <button class="card" data-id="${esc(e.id)}">
      <div class="head"><span class="word">${esc(e.infinitive)}</span></div>
      <div class="meaning">${esc(e.meaning)}</div>
      <div class="forms">${esc(stammformen(e))}</div>
    </button>`).join("");
}

let sheetCleanup = null;
function openSheet(title, html, onMount) {
  if (sheetCleanup) { sheetCleanup(); sheetCleanup = null; }
  $("#sheetTitle").textContent = title;
  // Fresh body node each time so listeners from the previous sheet can't linger.
  const old = $("#sheetBody");
  const fresh = old.cloneNode(false);
  old.replaceWith(fresh);
  fresh.innerHTML = html;
  fresh.scrollTop = 0;
  $("#backdrop").hidden = false;
  document.body.style.overflow = "hidden";
  if (onMount) sheetCleanup = onMount($("#sheetBody")) || null;
}
function closeSheet() {
  if (sheetCleanup) { sheetCleanup(); sheetCleanup = null; }
  $("#backdrop").hidden = true;
  $("#sheetBody").innerHTML = "";
  document.body.style.overflow = "";
}

function readForm(body, base) {

Rules:
- Only nouns and verbs are supported. If the input is (or clearly translates to) another word class, set status "unsupported", give the German translation and word class in message, and return no candidates.
- If several German words overlap in meaning (e.g. "medical report" → Arztbericht / Befund / Arztbrief) or the input is ambiguous, return up to 3 candidates, most common first, and explain the differences in message and in each candidate's whyThisOne. Never silently pick one when the choice matters. If one word is clearly right, return just that one.
- If the input is not a real word or you are not sure the German word exists, set status "unclear" and explain. Never invent words.
- If the input is German, keep that exact word as the first candidate (correcting only spelling/capitalisation).
- Nouns: article; word capitalised without article; plural without article (null if not normally used in the plural, and explain in pluralNote). If gender or plural changes with meaning, say so in note.
- Verbs: infinitive (with "sich" for reflexive verbs). Full Präsens and Präteritum for ich, du, er (= er/sie/es), wir, ihr, sie (= sie/Sie). Write complete forms including separated prefixes and reflexive pronouns, e.g. "rufe an", "freue mich", "rief an". perfektAux: ["haben"], ["sein"], or both when both are standard (e.g. fahren) — then explain the difference in note. partizip: Partizip II only. Set separable and reflexive.

- Standard German spelling (Duden). Double-check irregular forms before answering.

async function askClaude(text, hint, signal) {
  const key = Settings.get("apiKey", "");
  if (!key) { const err = new Error("Add your Claude API key in Settings first."); err.code = "nokey"; throw err; }
  let res;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST", signal,
    headers: {
      "content-type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: Settings.get("model", DEFAULT_MODEL),
      max_tokens: 4000,
      system: SYSTEM,
      tools: [TOOL],
      tool_choice: { type: "tool", name: TOOL.name },
      messages: [{ role: "user", content: `Input: ${text}\nRequested word type: ${hint}` }],
    }),
    });
  } catch (err) {
    if (err.name === "AbortError") throw err;
    const e2 = new Error("Couldn't reach Claude — check your connection."); e2.code = "network"; throw e2;
  }
  if (!res.ok) {
    let detail = "";
    try { detail = (await res.json()).error?.message || ""; } catch {}
    const map = {
      401: "Your API key was rejected. Check it in Settings.",
      403: "This API key isn't allowed to use that model.",
      404: "Model not found — pick another model in Settings.",
      429: "Rate limited — wait a moment and try again.",
      529: "Claude is overloaded right now — try again shortly.",
    };
    const err = new Error(map[res.status] || `Request failed (${res.status}). ${detail}`);
    err.detail = detail; throw err;
  }
  const data = await res.json();
  if (data.stop_reason === "max_tokens") throw new Error("The answer was cut off — try again.");
  const tu = (data.content || []).find(b => b.type === "tool_use");
  if (!tu) throw new Error("Unexpected answer from Claude — try again.");
  return { ...tu.input, usage: data.usage };
}

const ART = { m: "der", f: "die", n: "das", p: "die" };

    if (this.promise) return this.promise;

      try {
        const get = async name => {

          if (!r.ok) { const e = new Error(`HTTP ${r.status}`); e.status = r.status; throw e; }
          return r.json();

        const items = [];
        for (const r of nouns) {

          items.push({ k: "noun", word: r[0], g: r[1], pl: r[2], senses: r[3], rank: r[4],

// Exact German matches always come first. Otherwise one match class ≈ 50k frequency ranks,
// so a common word matched loosely (Tisch: "dining table") beats a rare exact one.
function searchScore(cls, x) {

    const code = articleCode && codes.includes(articleCode) ? articleCode : codes[0];

    let plural = null, pluralNote = "";

    else if (x.pl === "") pluralNote = "No plural in common use.";
    else if (x.pl === "?") pluralNote = "Plural not listed in the dictionary.";
    else {

function renderCandidates(out, r, text) {
  const cands = (r.candidates || [])
    .map(c => ({ c: normalize({ ...c, source: "claude" }, { keepMeta: false }), why: str(c.whyThisOne) }))
    .filter(x => validate(x.c).length === 0);
  const dropped = (r.candidates || []).length - cands.length;
  let html = "";
  if (r.message) html += `<div class="flag">${esc(r.message)}</div>`;
  if (r.status !== "ok" && !cands.length) {
    html += r.message ? "" : `<div class="flag">Claude couldn't find a noun or verb for “${esc(text)}”.</div>`;
  }
  if (dropped > 0) html += `<div class="error">${dropped} incomplete suggestion${dropped > 1 ? "s were" : " was"} skipped.</div>`;
  html += cands.map(({ c, why }, i) => {
    const dup = findDuplicate(c);
    return `<div class="cand">
      ${entryDetailHTML(c)}
      ${why && cands.length > 1 ? `<div class="why">${esc(why)}</div>` : ""}
      ${dup ? `<div class="dup">Already in your list.</div>` : ""}
      <div class="actions">
        ${dup ? `<button class="btn" data-open="${esc(dup.id)}">Open saved</button>` : ""}
        <button class="btn" data-edit="${i}">Edit first</button>
        <button class="btn primary" data-save="${i}">${dup ? "Save anyway" : "Save"}</button>
      </div></div>`;
  }).join("");
  out.innerHTML = html;
  out.onclick = async ev => {
    const s = ev.target.closest("[data-save]"), ed = ev.target.closest("[data-edit]"), op = ev.target.closest("[data-open]");
    if (op) return openDetail(op.dataset.open);
    if (ed) return openForm({ ...cands[+ed.dataset.edit].c }, { title: "Check & save", source: "claude" });
    if (s) {
      const c = cands[+s.dataset.save].c;
      const e = { ...c, id: uuid(), createdAt: nowISO(), updatedAt: nowISO(), source: "claude" };
      await saveEntry(e);
      s.disabled = true; s.textContent = "Saved ✓";
      toast(`Added ${headOf(e)}`);
    }
  };
}

      if (!matchMedia("(display-mode: standalone)").matches && !navigator.standalone)
        t += " Tip: in Safari, tap Share → Add to Home Screen and use it from there.";
      const el = body.querySelector("#s_storage"); if (el) el.textContent = t;
    })();
    body.addEventListener("click", async ev => {
      const b = ev.target.closest("[data-act]"); if (!b) return;
      const act = b.dataset.act;
      if (act === "toggleKey") { const i = body.querySelector("#s_key"); i.type = i.type === "password" ? "text" : "password"; b.textContent = i.type === "password" ? "Show" : "Hide"; }
      if (act === "saveKey") {
        const k = body.querySelector("#s_key").value.trim();
        if (k && !k.startsWith("sk-ant-")) { toast("That doesn't look like a Claude API key (sk-ant-…)", 3000); return; }
        Settings.set("apiKey", k); Settings.set("model", body.querySelector("#s_model").value);
        toast(k ? "Saved" : "Key removed"); openSettings();
      }
      if (act === "clearKey") { Settings.set("apiKey", null); toast("Key removed"); openSettings(); }
      if (act === "export") exportJSON(msg);
      if (act === "import") body.querySelector("#s_file").click();
    });
    body.querySelector("#s_file").addEventListener("change", async ev => {
      const file = ev.target.files[0]; if (!file) return;
      try { msg.textContent = await importJSON(await file.text()); }
      catch (err) { msg.textContent = "Import failed: " + err.message; }
      ev.target.value = "";
    });
  });
}

async function exportJSON(msgEl) {
  const payload = { app: "wortschatz", schemaVersion: SCHEMA_VERSION, exportedAt: nowISO(), entries: state.entries };
  const name = `wortschatz-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  try {
    const file = new File([blob], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "Wortschatz backup" });
    } else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }
    Settings.set("lastBackup", nowISO());
    if (msgEl) msgEl.textContent = `Exported ${state.entries.length} entries.`;
  } catch (err) {
    if (err.name !== "AbortError" && msgEl) msgEl.textContent = "Export failed: " + err.message;
  }
}

async function importJSON(text) {
  let data = JSON.parse(text);
  let list = Array.isArray(data) ? data : data.entries;
  if (!Array.isArray(list)) throw new Error("No entries found in that file.");
  const incoming = list.map(o => (o.type ? normalize({ ...o, source: o.source || "import" }) : fromLegacy({ ...o, source: "import" })))
                       .filter(e => e && validate(e).length === 0);
  let added = 0, updated = 0, skipped = 0;
  const byId = new Map(state.entries.map(e => [e.id, e]));
  const seenHeads = new Set(state.entries.map(e => e.type + ":" + fold(headOf(e))));
  const toWrite = [];
  for (const e of incoming) {
    const cur = byId.get(e.id);
    const head = e.type + ":" + fold(headOf(e));
    if (cur) {
      // same entry: newer edit wins
      if ((e.updatedAt || "") > (cur.updatedAt || "")) { toWrite.push(e); updated++; } else skipped++;
    } else if (seenHeads.has(head)) {
      skipped++; // same word already saved under a different id
    } else {
      toWrite.push(e); seenHeads.add(head); added++;
    }
  }
  if (toWrite.length) await DB.putMany(toWrite);
  state.entries = await DB.all();
  render();
  const bad = list.length - incoming.length;
  return `Imported: ${added} new, ${updated} updated, ${skipped} unchanged/duplicate${bad ? `, ${bad} invalid skipped` : ""}.`;
}

/* =========================================================
   Wiring
   ========================================================= */
document.querySelector(".seg").addEventListener("click", ev => {
  const b = ev.target.closest("button[data-tab]"); if (!b) return;
  state.tab = b.dataset.tab; render(); window.scrollTo({ top: 0 });
});
$("#search").addEventListener("input", ev => { state.q = ev.target.value; render(); });
$("#sort").addEventListener("change", ev => { state.sort = ev.target.value; Settings.set("sort", state.sort); render(); });
$("#list").addEventListener("click", ev => { const c = ev.target.closest(".card"); if (c) openDetail(c.dataset.id); });
$("#fab").addEventListener("click", () => {
  const q = state.q.trim();
  const hasMatch = q && $("#list .card");
  openAdd(q && !hasMatch ? q : "");
});
$("#btnSettings").addEventListener("click", openSettings);
$("#sheetClose").addEventListener("click", closeSheet);
$("#backdrop").addEventListener("click", ev => { if (ev.target.id === "backdrop") closeSheet(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !$("#backdrop").hidden) closeSheet(); });

load().catch(err => {
  $("#list").innerHTML = `<div class="empty"><strong>Storage unavailable</strong>${esc(err.message || String(err))}<br>Private Browsing blocks saving — open the app normally.</div>`;
});

if ("serviceWorker" in navigator && location.protocol !== "file:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
