<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wortfang</title>
<meta name="description" content="Wortfang — every German word you look up stays here: article, meaning and tenses, offline.">
<meta name="theme-color" content="#EEF0EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14180F" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wortfang">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF0EA;
    --surface: #FFFFFF;
    --surface-2: #F7F8F3;
    --ink: #1E2A23;
    --ink-soft: #5C6B5F;
    --ink-faint: #8B978C;
    --line: #DADFD3;
    --der: #2F5C8A;
    --der-soft: #E3EBF3;
    --die: #A13D46;
    --die-soft: #F4E2E3;
    --das: #4C7A54;
    --das-soft: #E4EEE3;
    --accent: #8A5A2F;
    --accent-soft: #F1E5D6;
    --accent-ink: #FFFFFF;
    --danger: #A13D46;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(30, 42, 35, .05);
    --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    --font-ui: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14180F;
      --surface: #1B211A;
      --surface-2: #1F261D;
      --ink: #E9EDE3;
      --ink-soft: #A6B39F;
      --ink-faint: #6E7B69;
      --line: #2E3729;
      --der: #86B4DE;
      --der-soft: #21323F;
      --die: #E19A9F;
      --die-soft: #3A2323;
      --das: #93C79C;
      --das-soft: #223227;
      --accent: #E0AD73;
      --accent-soft: #35291A;
      --accent-ink: #1B211A;
      --danger: #E19A9F;
      --shadow: none;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14180F; --surface: #1B211A; --surface-2: #1F261D; --ink: #E9EDE3; --ink-soft: #A6B39F;
    --ink-faint: #6E7B69; --line: #2E3729; --der: #86B4DE; --der-soft: #21323F; --die: #E19A9F;
    --die-soft: #3A2323; --das: #93C79C; --das-soft: #223227; --accent: #E0AD73; --accent-soft: #35291A;
    --accent-ink: #1B211A; --danger: #E19A9F; --shadow: none; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); }
  body { min-height: 100vh; min-height: 100dvh; -webkit-tap-highlight-color: transparent; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  .page {
    max-width: 640px; margin: 0 auto;
    padding: calc(22px + env(safe-area-inset-top)) 18px calc(56px + env(safe-area-inset-bottom));
  }

  /* ---------- hero ---------- */
  .hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  header.hero h1 {
    font-family: var(--font-display); font-weight: 600; font-size: 2.3rem;
    letter-spacing: -0.01em; margin: 0 0 8px;
  }
  header.hero .tagline { font-size: 0.98rem; color: var(--ink-soft); line-height: 1.5; margin: 0 0 12px; max-width: 46ch; }
  header.hero .stats { font-size: 0.85rem; color: var(--ink-faint); margin: 0 0 18px; min-height: 1.2em; }
  .icon-btn {
    flex: 0 0 auto; width: 40px; height: 40px; margin-top: 4px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft);
    display: grid; place-items: center; padding: 0;
  }
  .icon-btn svg { width: 19px; height: 19px; }

  /* ---------- lookup ---------- */
  .lookup-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px; margin-bottom: 22px; box-shadow: var(--shadow);
  }
  .lookup-bar { display: flex; gap: 8px; margin: 0; }
  .lookup-bar input {
    flex: 1; min-width: 0; font-size: 16px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--ink);
  }
  .lookup-bar input::placeholder { color: var(--ink-faint); }
  .lookup-bar button:disabled { opacity: 0.55; cursor: default; }
  .lookup-status { margin: 10px 2px 0; font-size: 0.88rem; line-height: 1.5; }
  .lookup-status p { margin: 0; }
  .lookup-status .loading { color: var(--ink-soft); }
  .lookup-status .success { color: var(--das); }
  .lookup-status .error { color: var(--die); }
  .lookup-status .info { color: var(--ink-soft); }
  .lookup-status .gnote { color: var(--ink-soft); font-size: 0.82rem; margin-top: 2px; }
  .alts { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  .alts .alts-label { font-size: 0.78rem; color: var(--ink-faint); margin: 0 0 6px; }
  .alt-btn {
    display: flex; width: 100%; align-items: baseline; gap: 6px; text-align: left;
    border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px;
    padding: 7px 10px; margin-bottom: 6px; font-size: 0.86rem; color: var(--ink);
  }
  .alt-btn .alt-head { font-weight: 600; white-space: nowrap; }
  .alt-btn .alt-gloss { color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .alt-btn .alt-kind { margin-left: auto; font-size: 0.72rem; color: var(--ink-faint); white-space: nowrap; }
  .status-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .linkbtn {
    appearance: none; border: none; background: none; padding: 2px 0; font-size: 0.84rem;
    color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 2px;
  }

  /* ---------- tabs & toolbar ---------- */
  nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .tab {
    appearance: none; border: none; background: none; font-size: 0.95rem; font-weight: 500;
    color: var(--ink-faint); padding: 10px 4px; margin-right: 22px; position: relative;
    display: flex; align-items: baseline; gap: 6px;
  }
  .tab .tab-count { font-size: 0.78rem; color: var(--ink-faint); }
  .tab.active { color: var(--ink); }
  .tab.active::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: var(--accent); border-radius: 2px;
  }
  .tab[data-tab="noun"].active::after { background: linear-gradient(90deg, var(--der), var(--die) 50%, var(--das)); }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  #searchInput {
    flex: 1 1 150px; min-width: 0; font-size: 16px; padding: 9px 12px;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink);
  }
  #searchInput::placeholder { color: var(--ink-faint); }
  #searchInput:focus, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .btn-add {
    font-size: 0.92rem; font-weight: 600; white-space: nowrap; padding: 9px 14px; border: none;
    border-radius: var(--radius); background: var(--accent); color: var(--accent-ink);
  }
  .btn-secondary {
    font-size: 0.88rem; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: var(--ink-soft);
  }
  .btn-primary {
    font-weight: 600; font-size: 0.88rem; padding: 8px 14px; border-radius: 8px; border: none;
    background: var(--ink); color: var(--surface);
  }
  .btn-danger {
    font-weight: 600; font-size: 0.88rem; padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--danger); background: transparent; color: var(--danger);
  }
  .btn-danger.armed { background: var(--danger); color: var(--surface); }

  /* ---------- add / edit form ---------- */
  .add-form {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; margin-bottom: 18px; display: grid; gap: 10px;
  }
  .form-title { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 1.15rem; }
  .add-form .row { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
  .add-form .row.three { grid-template-columns: 1fr 1fr 1fr; }
  .field-group-label { font-size: 0.8rem; font-weight: 600; color: var(--ink); margin: 6px 0 -2px; }
  .field { display: grid; gap: 4px; min-width: 0; }
  .field label { font-size: 0.76rem; color: var(--ink-soft); }
  .field input, .field select, .field textarea {
    font-size: 16px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface-2); color: var(--ink); width: 100%; min-width: 0;
  }
  .field textarea { resize: vertical; min-height: 44px; }
  .checks { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.86rem; color: var(--ink-soft); }
  .checks label { display: inline-flex; gap: 6px; align-items: center; }
  .checks input { accent-color: var(--accent); width: 16px; height: 16px; }
  .article-toggle { display: flex; gap: 6px; }
  .article-btn {
    flex: 1; font-weight: 600; font-size: 0.9rem; padding: 8px 0; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-soft);
  }
  .article-btn[data-art="der"].selected { background: var(--der-soft); border-color: var(--der); color: var(--der); }
  .article-btn[data-art="die"].selected { background: var(--die-soft); border-color: var(--die); color: var(--die); }
  .article-btn[data-art="das"].selected { background: var(--das-soft); border-color: var(--das); color: var(--das); }
  .form-error { color: var(--danger); font-size: 0.85rem; margin: 0; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 2px; }

  /* ---------- cards ---------- */
  .empty-state { color: var(--ink-faint); font-size: 0.92rem; padding: 26px 4px; line-height: 1.6; margin: 0; }
  .cards { display: grid; gap: 10px; }
  .word-card, .verb-card {
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--card-accent, var(--line)); border-radius: var(--radius);
    padding: 13px 14px 12px; box-shadow: var(--shadow);
    transition: box-shadow .4s, border-color .4s;
  }
  .word-card.der { --card-accent: var(--der); }
  .word-card.die { --card-accent: var(--die); }
  .word-card.das { --card-accent: var(--das); }
  .verb-card { --card-accent: var(--accent); }
  .flash { box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
  .word-head { display: flex; align-items: center; gap: 8px; }
  .article-pill { font-weight: 600; font-size: 0.72rem; padding: 2px 8px; border-radius: 999px; text-transform: lowercase; }
  .article-pill.der { background: var(--der-soft); color: var(--der); }
  .article-pill.die { background: var(--die-soft); color: var(--die); }
  .article-pill.das { background: var(--das-soft); color: var(--das); }
  .word-title { font-family: var(--font-display); font-size: 1.28rem; font-weight: 500; margin: 0; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .tagchip { font-size: 0.68rem; color: var(--ink-faint); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
  .del-btn, .edit-btn {
    appearance: none; border: none; background: none; color: var(--ink-faint);
    font-size: 1.1rem; line-height: 1; padding: 4px 6px; border-radius: 6px; white-space: nowrap;
  }
  .edit-btn { font-size: 0.95rem; }
  .del-btn:hover { color: var(--danger); }
  .edit-btn:hover { color: var(--ink); }
  .del-btn.armed { font-size: 0.78rem; font-weight: 600; color: var(--surface); background: var(--danger); padding: 5px 8px; }
  .plural, .meaning { margin: 6px 0 0; font-size: 0.92rem; }
  .plural { color: var(--ink-soft); }
  .meaning { color: var(--ink); }
  .note { margin: 6px 0 0; font-size: 0.8rem; color: var(--ink-faint); line-height: 1.45; }
  .example { margin: 8px 0 0; font-size: 0.86rem; font-style: italic; color: var(--ink-soft); line-height: 1.5; }
  .example .example-en { font-style: normal; color: var(--ink-faint); }
  .added { margin: 8px 0 0; font-size: 0.72rem; color: var(--ink-faint); }
  .conj-block { margin: 12px 0 0; }
  .conj-block + .conj-block { margin-top: 10px; }
  .conj-label { color: var(--ink-faint); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.02em; margin: 0 0 4px; }
  /* singular | plural, read top-to-bottom like a German grammar table */
  .conj-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, auto); grid-auto-flow: column; gap: 3px 14px; font-size: 0.86rem; color: var(--ink); }
  .conj-grid > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conj-grid .conj-pn { color: var(--ink-faint); margin-right: 4px; }
  @media (min-width: 520px) { .add-form .row.three { grid-template-columns: 1fr 1fr 1fr; } }
  .footer-note { margin: 26px 0 0; font-size: 0.72rem; color: var(--ink-faint); text-align: center; }

  /* ---------- table view ---------- */
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  table.dense { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
  table.dense th {
    text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.02em; font-weight: 600;
    color: var(--ink-faint); padding: 9px 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap;
  }
  table.dense td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.dense tr:last-child td { border-bottom: none; }
  table.dense td.art-cell { font-weight: 600; white-space: nowrap; }
  table.dense td.art-cell.der { color: var(--der); }
  table.dense td.art-cell.die { color: var(--die); }
  table.dense td.art-cell.das { color: var(--das); }
  table.dense td.del-cell { text-align: right; white-space: nowrap; }
  td.table-empty { text-align: center; color: var(--ink-faint); padding: 18px 10px !important; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(8, 12, 7, 0.5); display: flex; align-items: flex-start;
    justify-content: center; padding: calc(6vh + env(safe-area-inset-top)) 12px 12px; z-index: 30;
  }
  .modal-panel {
    background: var(--surface); border-radius: 14px; width: 100%; max-width: 640px; max-height: 84vh;
    display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
  }
  .modal-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 8px 12px 16px; border-bottom: 1px solid var(--line); }
  .modal-subtabs { display: flex; gap: 6px; }
  .subtab {
    font-size: 0.85rem; font-weight: 600; padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-soft);
  }
  .subtab.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .modal-close { appearance: none; border: none; background: none; font-size: 1.6rem; line-height: 1; color: var(--ink-faint); padding: 4px 10px; }
  .modal-search {
    margin: 12px 16px 0; font-size: 16px; padding: 9px 11px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--surface-2); color: var(--ink);
  }
  .modal-body { padding: 12px 16px 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .modal-body .table-wrap { border: none; }

  /* ---------- settings sheet ---------- */
  .backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(8, 12, 7, 0.45); display: flex; align-items: flex-end; justify-content: center; }
  .sheet {
    width: 100%; max-width: 640px; max-height: calc(100dvh - env(safe-area-inset-top) - 24px);
    background: var(--bg); border-radius: 18px 18px 0 0; display: flex; flex-direction: column;
    animation: up .18s ease-out;
  }
  @keyframes up { from { transform: translateY(24px); } to { transform: none; } }
  @media (min-width: 700px) { .backdrop { align-items: center; } .sheet { border-radius: 18px; max-height: 88vh; } }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .sheet-head h2 { margin: 0; font: 600 1.1rem/1.2 var(--font-ui); }
  .textbtn { border: 0; background: none; color: var(--ink-soft); padding: 8px 4px; font-weight: 500; }
  .sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
  .setting-block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; font-size: 0.9rem; }
  .setting-block h3 { margin: 0 0 8px; font: 600 0.95rem/1.2 var(--font-ui); }
  .setting-block p { margin: 0 0 8px; color: var(--ink-soft); line-height: 1.45; }
  .setting-block .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .setting-block .hint { font-size: 0.82rem; color: var(--ink-soft); margin-top: 8px; }
  .sheet-meta { font-size: 0.74rem; color: var(--ink-faint); margin-top: 14px; line-height: 1.5; }

  /* ---------- install hint ---------- */
  .install { margin: 0 0 16px; }
  .install-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; font-size: 0.88rem; line-height: 1.45; box-shadow: var(--shadow); }
  .install-card h3 { margin: 0 0 4px; font: 600 0.95rem/1.25 var(--font-ui); }
  .install-card p { margin: 6px 0 0; }
  .install-card .note { color: var(--ink-faint); font-size: 0.8rem; margin-top: 6px; }
  .install-card .row { display: flex; gap: 8px; margin-top: 10px; }
  #s_install p { color: var(--ink-soft); }
  #s_install .note { font-size: 0.8rem; color: var(--ink-faint); }
  #s_install .row { display: flex; gap: 8px; margin-top: 8px; }
  .ios-share { display: inline-block; width: 16px; height: 16px; vertical-align: -3px; color: #0a84ff; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
    bottom: calc(22px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 14px;
    background: var(--ink); color: var(--surface); padding: 10px 14px; border-radius: 10px;
    font-size: 0.88rem; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.2);
  }
  .toast button { border: 0; background: none; color: var(--accent-soft); font-weight: 700; padding: 2px 0; }
  :root[data-theme="dark"] .toast button { color: var(--bg); }
</style>
</head>
<body>
<div class="page">

  <header class="hero">
    <div class="hero-top">
      <h1>Wortfang</h1>
      <button class="icon-btn" id="btnSettings" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
    <p class="tagline">Every word you look up stays here — article, meaning and tenses, ready when you need to review.</p>
    <p class="stats" id="statsLine"></p>
  </header>

  <div class="install" id="installBanner" hidden></div>

  <div class="lookup-card">
    <form class="lookup-bar" id="lookupForm" autocomplete="off">
      <input type="search" id="lookupInput" placeholder="English or German word" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Word to look up">
      <button class="btn-primary" id="lookupBtn" type="submit">Look up</button>

const CLAUDE_ENABLED = false;

/* =========================================================

const DB = (() => {
  let dbp;

      praesens: Object.fromEntries(PERSONS.map(p => [p, o["praesens" + cap[p]]])),
      praeteritum: Object.fromEntries(PERSONS.map(p => [p, o["praeteritum" + cap[p]]])),

/* =========================================================
   State & helpers
   ========================================================= */
const state = { entries: [], tab: "noun", q: "", modalTab: "noun", editingId: null };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const collator = new Intl.Collator("de-DE", { sensitivity: "base" });

function perfektForm(e, p, aux) {

}
function stammformen(e) {
  const aux = e.perfektAux.map(a => AUX[a].er).join("/");

function fmtDate(iso) {

}


let sheetCleanup = null;
function openSheet(title, html, onMount) {

}


/* =========================================================
   Ask Claude
   ========================================================= */
const FORMS_SCHEMA = { type: "object", properties: Object.fromEntries(PERSONS.map(p => [p, { type: "string" }])), required: PERSONS };
const TOOL = {
  name: "propose_entries",
  description: "Return German dictionary entries (nouns or verbs) for the learner's input.",
  input_schema: {
    type: "object",
    properties: {
      status: { type: "string", enum: ["ok", "unsupported", "unclear"],
        description: "ok = candidates returned; unsupported = not a noun/verb; unclear = unknown or not a real word." },
      message: { type: "string", description: "Short note for the learner: overlapping terms, ambiguity, or why unsupported. Empty string if nothing to flag." },
      candidates: {
        type: "array", maxItems: 3,
        items: {
          type: "object",
          properties: {
            type: { type: "string", enum: ["noun", "verb"] },
            whyThisOne: { type: "string", description: "When there are several candidates: how this one differs. Else empty." },
            article: { type: "string", enum: ["der", "die", "das"] },
            word: { type: "string", description: "Noun, capitalised, without article." },
            plural: { type: ["string", "null"], description: "Plural without article, or null if not used in the plural." },
            pluralNote: { type: "string" },
            infinitive: { type: "string", description: "Verb infinitive; include 'sich' for reflexive verbs." },
            praesens: FORMS_SCHEMA,
            praeteritum: FORMS_SCHEMA,
            perfektAux: { type: "array", items: { type: "string", enum: ["haben", "sein"] } },
            partizip: { type: "string", description: "Partizip II only, e.g. 'angerufen'." },
            separable: { type: "boolean" },
            reflexive: { type: "boolean" },
            meaning: { type: "string", description: "Concise English gloss, main sense first." },
            note: { type: "string" },
            example: { type: "string", description: "Natural everyday German sentence using the word." },
            exampleEn: { type: "string" },
          },
          required: ["type", "meaning", "example", "exampleEn"],
        },
      },
    },
    required: ["status", "message", "candidates"],
  },
};
const SYSTEM = `You are a careful German lexicographer helping an English-speaking learner build a personal vocabulary list. The learner sends one word or short phrase, in English or German.

Rules:
- Only nouns and verbs are supported. If the input is (or clearly translates to) another word class, set status "unsupported", give the German translation and word class in message, and return no candidates.
- If several German words overlap in meaning (e.g. "medical report" → Arztbericht / Befund / Arztbrief) or the input is ambiguous, return up to 3 candidates, most common first, and explain the differences in message and in each candidate's whyThisOne. Never silently pick one when the choice matters. If one word is clearly right, return just that one.
- If the input is not a real word or you are not sure the German word exists, set status "unclear" and explain. Never invent words.
- If the input is German, keep that exact word as the first candidate (correcting only spelling/capitalisation).
- Nouns: article; word capitalised without article; plural without article (null if not normally used in the plural, and explain in pluralNote). If gender or plural changes with meaning, say so in note.
- Verbs: infinitive (with "sich" for reflexive verbs). Full Präsens and Präteritum for ich, du, er (= er/sie/es), wir, ihr, sie (= sie/Sie). Write complete forms including separated prefixes and reflexive pronouns, e.g. "rufe an", "freue mich", "rief an". perfektAux: ["haben"], ["sein"], or both when both are standard (e.g. fahren) — then explain the difference in note. partizip: Partizip II only. Set separable and reflexive.
- meaning: concise English gloss. note: optional, short (register, false friends, related words); empty string if none.
- example: one natural everyday German sentence; exampleEn: its English translation.
- Standard German spelling (Duden). Double-check irregular forms before answering.

async function askClaude(text, hint, signal) {
  const key = Settings.get("apiKey", "");
  if (!key) { const err = new Error("Add your Claude API key in Settings first."); err.code = "nokey"; throw err; }
  let res;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST", signal,
    headers: {
      "content-type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: Settings.get("model", DEFAULT_MODEL),
      max_tokens: 4000,
      system: SYSTEM,
      tools: [TOOL],
      tool_choice: { type: "tool", name: TOOL.name },
      messages: [{ role: "user", content: `Input: ${text}\nRequested word type: ${hint}` }],
    }),
    });
  } catch (err) {
    if (err.name === "AbortError") throw err;
    const e2 = new Error("Couldn't reach Claude — check your connection."); e2.code = "network"; throw e2;
  }
  if (!res.ok) {
    let detail = "";
    try { detail = (await res.json()).error?.message || ""; } catch {}
    const map = {
      401: "Your API key was rejected. Check it in Settings.",
      403: "This API key isn't allowed to use that model.",
      404: "Model not found — pick another model in Settings.",
      429: "Rate limited — wait a moment and try again.",
      529: "Claude is overloaded right now — try again shortly.",
    };
    const err = new Error(map[res.status] || `Request failed (${res.status}). ${detail}`);
    err.detail = detail; throw err;
  }
  const data = await res.json();
  if (data.stop_reason === "max_tokens") throw new Error("The answer was cut off — try again.");
  const tu = (data.content || []).find(b => b.type === "tool_use");
  if (!tu) throw new Error("Unexpected answer from Claude — try again.");
  return { ...tu.input, usage: data.usage };
}


/* =========================================================

      // "dining table," → the query is the head noun of a short phrase: nearly as good as a start match.
      const endsPhrase = !atStart && !afterTo && wholeSense && idx - e.lastIndexOf("\u0001", idx) < 24;
      let cls = atStart || afterTo ? (wholeSense ? 2 : 4) : endsPhrase ? 3.5 : 5;
      if ((atStart || afterTo) && afterTo !== hasTo) cls += 0.5;
      const senseIdx = e.slice(0, idx).split("\u0001").length - 1;
      best = Math.min(best, cls + senseIdx * 0.1);
    }
    idx = e.indexOf(q, idx + 1);
  }
  return best;
}
function dictStamm(x) {
  const aux = x.aux.split(",").filter(a => !a.startsWith("(")).map(a => (a === "s" ? "ist" : "hat")).join("/");
  return `er ${x.pr[2]} · ${x.pt[2]} · ${aux} ${x.part}`;
}
function withRefl(form, p) {
  const [first, ...rest] = form.split(" ");

}
/* Map a dictionary item + chosen sense (and article for nouns) into an app entry. */
function dictToEntry(x, senseIdx = 0, articleCode) {
  const chosen = x.senses[senseIdx] || x.senses[0];
  const label = labelOf(chosen);
  const others = x.senses.filter((_, i) => i !== senseIdx).map(stripLabel).slice(0, 3);
  const usage = label.split(", ").filter(l => l && l !== "reflexive").join(", ");
  const notes = [];
  if (usage) notes.push(`Usage: ${usage}.`);
  if (others.length) notes.push(`Other meanings: ${others.join("; ")}.`);
  const base = { meaning: stripLabel(chosen), example: "", exampleEn: "", source: "wiktionary" };
  if (x.k === "noun") {
    const codes = x.g.split("");
    const code = articleCode && codes.includes(articleCode) ? articleCode : codes[0];
    if (x.g !== "p" && codes.length > 1) notes.unshift(`Gender varies: ${codes.map(c => ART[c]).join(" / ")} ${x.word}.`);
    let plural = null, pluralNote = "";
    if (x.g === "p") { plural = x.word; pluralNote = "Plural only — no singular."; }
    else if (x.pl === "") pluralNote = "No plural in common use.";
    else if (x.pl === "?") pluralNote = "Plural not listed in the dictionary.";
    else {
      const ps = x.pl.split("|");
      plural = ps[0];
      if (ps.length > 1) pluralNote = `Also: ${ps.slice(1).join(", ")}.`;
    }
    return normalize({ ...base, type: "noun", article: ART[code], word: x.word, plural, pluralNote, note: notes.join(" ") }, { keepMeta: false });
  }
  const reflexive = label.split(", ").includes("reflexive") || x.flags.includes("r");
  const auxes = x.aux.split(",");
  const normalAux = auxes.filter(a => !a.startsWith("(")).map(a => (a === "s" ? "sein" : "haben"));
  const rareAux = auxes.filter(a => a.startsWith("(")).map(a => (a.includes("s") ? "sein" : "haben"));
  if (normalAux.length > 1) notes.push("Perfekt with haben or sein — depends on the meaning (and sometimes region).");
  if (rareAux.length) notes.push(`Perfekt rarely with ${rareAux.join("/")}.`);
  const forms = arr => Object.fromEntries(PERSONS.map((p, i) => [p, reflexive ? withRefl(arr[i], p) : arr[i]]));
  return normalize({ ...base, type: "verb",
    infinitive: reflexive ? `sich ${x.word}` : x.word,
    praesens: forms(x.pr), praeteritum: forms(x.pt),
    perfektAux: normalAux.length ? normalAux : rareAux, partizip: x.part,
    separable: x.flags.includes("s"), reflexive, note: notes.join(" ") }, { keepMeta: false });
}

// Two-tap confirm for destructive buttons: first tap arms, second tap (within 3 s) runs.
function armOrRun(btn, armedLabel, run) {

async function saveEntry(e) {

async function deleteWithUndo(id) {

function matches(e, q) {
  if (!q) return true;
  const hay = [headOf(e), e.meaning, e.note, e.plural, e.partizip,
    ...(e.type === "verb" ? [...Object.values(e.praesens), ...Object.values(e.praeteritum)] : [])].map(fold).join(" ");
  return hay.includes(q);

  $("#statsLine").textContent = nouns.length || verbs.length
    ? `${nouns.length} noun${nouns.length === 1 ? "" : "s"} saved, ${verbs.length} verb${verbs.length === 1 ? "" : "s"} saved.`
    : "";
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.tab === state.tab));

  const all = state.tab === "noun" ? nouns : verbs;
  const q = fold(state.q.trim());
  const items = all.filter(e => matches(e, q)).sort(newestFirst);
  const empty = $("#emptyState");
  const list = $("#cardList");
  if (!all.length) {
    empty.hidden = false;
    empty.textContent = state.tab === "noun"

function openForm(entry) {

  const isEdit = !!entry.id && state.entries.some(x => x.id === entry.id);
  const draft = isEdit ? { ...entry } : normalize({ type: state.tab, ...entry, source: entry.source || "manual" }, { keepMeta: false });
  if (state.tab !== draft.type) { state.tab = draft.type; renderAll(); }
  state.editingId = isEdit ? draft.id : null;
  state.formDraft = draft;
  delete form.dataset.dupOk;
  form.innerHTML = formHTML(draft, isEdit);
  form.hidden = false;
  $("#addToggle").textContent = "Close form";
  form.scrollIntoView({ behavior: "smooth", block: "start" });

function closeForm() {

function readForm(form, base) {
  const val = n => (form.querySelector(`[name="${n}"]`)?.value ?? "");
  const raw = { ...base, meaning: val("meaning"), note: val("note"), example: val("example"), exampleEn: val("exampleEn") };
  if (base.type === "noun") {
    raw.article = form.querySelector(".article-btn.selected")?.dataset.art || "";
    raw.word = val("word");
    raw.plural = val("plural");
  } else {
    raw.infinitive = val("infinitive");
    raw.praesens = Object.fromEntries(PERSONS.map(p => [p, val("praesens." + p)]));
    raw.praeteritum = Object.fromEntries(PERSONS.map(p => [p, val("praeteritum." + p)]));
    const aux = val("aux");
    raw.perfektAux = aux === "both" ? ["haben", "sein"] : [aux];
    raw.partizip = val("partizip");
    raw.separable = form.querySelector("[name=separable]").checked;
    raw.reflexive = form.querySelector("[name=reflexive]").checked;

async function submitForm(ev) {
  ev.preventDefault();
  const form = $("#entryForm");
  const base = state.formDraft;
  if (!base) return;
  const isEdit = !!state.editingId;
  const e = readForm(form, base);
  e.id = base.id;
  e.createdAt = isEdit ? base.createdAt : nowISO();
  e.updatedAt = nowISO();
  e.source = base.source || "manual";
  // The model form doesn't require conjugations; only ask for the essentials.
  const errs = validate(e).filter(m => !/Partizip/.test(m));
  const errEl = form.querySelector("#formErr");
  if (errs.length) { errEl.hidden = false; errEl.textContent = errs.join(" "); return; }
  const dup = findDuplicate(e, e.id);
  if (dup && !form.dataset.dupOk) {
    errEl.hidden = false;
    errEl.textContent = `“${headOf(dup)}” is already saved. Tap save again to keep both.`;
    form.dataset.dupOk = "1";
    return;
  }
  await saveEntry(e);
  closeForm();
  state.tab = e.type;
  renderAll();
  flashCard(e.id);
  toast(isEdit ? `Saved changes to ${headOf(e)}` : `Saved ${headOf(e)}`);
}

  const q = raw.trim();
  if (!q) return;
  const btn = $("#lookupBtn");
  btn.disabled = true;
  try {
    if (Dict.state !== "ready") {
      setStatus(`<p class="loading">Looking up “${esc(q)}”… (loading the dictionary)</p>`);
      await Dict.load();
    }
    if (Dict.state === "missing") {
      setStatus(`<p class="error">The offline dictionary isn't installed on this site yet — add the word manually below.</p>`);
      return;
    }
    if (Dict.state !== "ready") {
      setStatus(`<p class="error">Couldn't load the dictionary — check your connection and try again.</p>`);
      return;
    }
    const scored = Dict.searchScored(q, "auto", 6);
    const results = scored.map(o => o.x);
    if (!results.length) {
      const claude = CLAUDE_ENABLED && Settings.get("apiKey", "");
      setStatus(`<p class="error">No dictionary match for “${esc(q)}”. Only German nouns and verbs are included — check the spelling or try the infinitive / singular.</p>
        <div class="status-actions">
          <button type="button" class="linkbtn" data-lk="manual">Add it manually</button>
          ${claude ? `<button type="button" class="linkbtn" data-lk="claude">Ask Claude</button>` : ""}
        </div>`);
      Lookup.query = q; Lookup.results = []; Lookup.idx = -1; Lookup.savedId = null; Lookup.fresh = false;
      return;
    }
    Object.assign(Lookup, { query: q, results, idx: -1, savedId: null, fresh: false });
    const c0 = scored[0].cls;
    if (c0 <= 2.6 || (c0 >= 3.5 && c0 < 3.7)) {
      await saveResult(0, false);
      $("#lookupInput").value = "";
    } else {
      // Only loose matches (e.g. an adjective like "schnell" → schnellen): let the user pick.
      setStatus(`<p class="info">No exact noun or verb for “${esc(q)}”. Did you mean one of these?</p>${altsHTML()}
        <div class="status-actions"><button type="button" class="linkbtn" data-lk="manual">None of these — add it manually</button></div>`);
    }
  } finally {
    btn.disabled = false;
  }
}
async function saveResult(i, replaceFresh) {
  const x = Lookup.results[i];
  if (!x) return;
  if (replaceFresh && Lookup.fresh && Lookup.savedId) await removeEntry(Lookup.savedId);
  const entry = dictToEntry(x, 0);
  const dup = findDuplicate(entry);
  Lookup.idx = i;
  if (dup) {
    Lookup.savedId = dup.id;
    Lookup.fresh = false;
    state.tab = dup.type; state.q = ""; $("#searchInput").value = "";
    renderAll();
    flashCard(dup.id, false);
    setStatus(`<p class="info">Already saved: <b>${esc(entryLabel(dup))}</b> — ${esc(dup.meaning)}</p>${altsHTML()}`);
    return;
  }
  const e = { ...entry, createdAt: nowISO(), updatedAt: nowISO() };
  await saveEntry(e);
  Lookup.savedId = e.id;
  Lookup.fresh = true;
  state.tab = e.type; state.q = ""; $("#searchInput").value = "";
  renderAll();
  flashCard(e.id, false);
  const gn = grammarNote(e);
  setStatus(`<p class="success">Saved: <b>${esc(entryLabel(e))}</b> — ${esc(e.meaning)}</p>
    ${gn ? `<p class="gnote">${esc(gn)}</p>` : ""}
    <div class="status-actions">
      <button type="button" class="linkbtn" data-lk="undo">Undo</button>
      <button type="button" class="linkbtn" data-lk="edit">Edit / add an example</button>
    </div>
    ${altsHTML()}`);
}
async function onStatusClick(ev) {
  const alt = ev.target.closest("[data-alt]");
  if (alt) { await saveResult(+alt.dataset.alt, true); return; }
  const b = ev.target.closest("[data-lk]");
  if (!b) return;
  const act = b.dataset.lk;
  if (act === "undo" && Lookup.savedId && Lookup.fresh) {
    const e = await removeEntry(Lookup.savedId);
    Lookup.savedId = null; Lookup.fresh = false;
    renderAll();
    setStatus(e ? `<p class="info">Removed ${esc(entryLabel(e))}.</p>${altsHTML()}` : "");
  }
  if (act === "edit" && Lookup.savedId) {
    const e = state.entries.find(x => x.id === Lookup.savedId);
    if (e) openForm(e);
  }
  if (act === "manual") {
    const q = Lookup.query;
    const looksVerb = /^(to\s|sich\s)|[a-zäöü](en|ern|eln)$/.test(q) && q[0] === q[0].toLowerCase();
    state.tab = looksVerb ? "verb" : state.tab;
    renderAll();
    openForm(looksVerb ? { type: "verb", infinitive: q.replace(/^to\s+/, "") } : { type: state.tab, ...(state.tab === "noun" ? { word: q } : { infinitive: q }) });
  }
  if (act === "claude") await lookupWithClaude(Lookup.query);
}
async function lookupWithClaude(q) {
  setStatus(`<p class="loading">Asking Claude about “${esc(q)}”…</p>`);
  try {
    const r = await askClaude(q, "auto");
    const c = (r.candidates || []).map(c => normalize({ ...c, source: "claude" }, { keepMeta: false })).find(c => validate(c).length === 0);
    if (!c) { setStatus(`<p class="error">${esc(r.message || "Claude couldn't find a German noun or verb for that.")}</p>`); return; }
    const e = { ...c, createdAt: nowISO(), updatedAt: nowISO() };
    await saveEntry(e);
    Object.assign(Lookup, { savedId: e.id, fresh: true, results: [], idx: -1 });
    state.tab = e.type; renderAll(); flashCard(e.id, false);
    setStatus(`<p class="success">Saved: <b>${esc(entryLabel(e))}</b> — ${esc(e.meaning)}</p>${r.message ? `<p class="gnote">${esc(r.message)}</p>` : ""}
      <div class="status-actions"><button type="button" class="linkbtn" data-lk="undo">Undo</button></div>`);
  } catch (err) {
    setStatus(`<p class="error">${esc(err.message || "Claude lookup failed.")}</p>`);
  }
}

    </div>

      <div class="field"><input id="s_key" type="password" value="${esc(key)}" placeholder="sk-ant-…" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <div class="field" style="margin-top:8px"><select id="s_model">${MODELS.map(m => `<option value="${m.id}" ${m.id === model ? "selected" : ""}>${esc(m.label)}</option>`).join("")}</select></div>
      <div class="actions" style="margin-top:8px"><button class="btn-primary" type="button" data-act="saveKey">Save key</button></div>
    </div>` : ""}
    <div class="setting-block">
      <h3>Storage</h3>
      <p id="s_storage">Checking…</p>
    </div>
    <p class="sheet-meta">Wortfang · data schema v${SCHEMA_VERSION} · app code MIT License · dictionary data © Wiktionary contributors, CC BY-SA 4.0, via Wiktextract / kaikki.org · word frequencies: FrequencyWords (OpenSubtitles), CC BY-SA 4.0</p>`, body => {
    const msg = body.querySelector("#s_msg");
    body.querySelector("#s_install").innerHTML = Install.settingsHTML();
    Dict.load().then(() => {
      const el = body.querySelector("#s_dict"); if (!el) return;
      if (Dict.state === "ready") {
        const m = Dict.meta || {};
        el.textContent = `${(m.nouns || 0).toLocaleString()} nouns and ${(m.verbs || 0).toLocaleString()} verbs (built ${m.built || "?"}). Saved on this device, so lookups work offline.`;
      } else if (Dict.state === "missing") {
        el.textContent = "Not installed on this site yet (see README: tools/build_dict.py).";
      } else {
        el.textContent = "Couldn't load it right now — check your connection.";
      }
    });
    (async () => {
      let t = "Saved in this browser's storage on this device.";
      try {
        if (navigator.storage?.persisted) t += (await navigator.storage.persisted())
          ? " Marked as persistent — the system shouldn't clear it."
          : " Not marked persistent yet; keep backups.";
      } catch {}
      const el = body.querySelector("#s_storage"); if (el) el.textContent = t;
    })();
    body.addEventListener("click", async ev => {
      const b = ev.target.closest("[data-act]"); if (!b) return;
      const act = b.dataset.act;
      if (act === "export") exportJSON(msg);
      if (act === "import") body.querySelector("#s_file").click();
      if (act === "wipe") {
        armOrRun(b, `Tap again to erase ${count} word${count === 1 ? "" : "s"}`, async () => {
          await DB.clear();
          state.entries = [];
          Object.assign(Lookup, { query: "", results: [], idx: -1, savedId: null, fresh: false });
          setStatus("");
          $("#lookupInput").value = "";
          state.q = ""; $("#searchInput").value = "";
          closeForm();
          renderAll();

          toast("All words deleted");
        });
      }
      if (act === "saveKey") {

        toast(k ? "Key saved" : "Key removed");

    });
    body.querySelector("#s_file").addEventListener("change", async ev => {
      const file = ev.target.files[0]; if (!file) return;
      try { msg.textContent = await importJSON(await file.text()); }
      catch (err) { msg.textContent = "Import failed: " + err.message; }
      ev.target.value = "";
    });
  });
}


async function exportJSON(msgEl) {
  const payload = { app: "wortfang", schemaVersion: SCHEMA_VERSION, exportedAt: nowISO(), entries: state.entries };
  const name = `wortfang-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  try {
    const file = new File([blob], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "Wortfang backup" });
    } else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }
    Settings.set("lastBackup", nowISO());
    if (msgEl) msgEl.textContent = `Exported ${state.entries.length} entries.`;
  } catch (err) {
    if (err.name !== "AbortError" && msgEl) msgEl.textContent = "Export failed: " + err.message;
  }
}

async function importJSON(text) {
  let data = JSON.parse(text);
  let list = Array.isArray(data) ? data : data.entries;
  if (!Array.isArray(list)) throw new Error("No entries found in that file.");
  const incoming = list.map(o => (o.type ? normalize({ ...o, source: o.source || "import" }) : fromLegacy({ ...o, source: "import" })))
                       .filter(e => e && validate(e).length === 0);
  let added = 0, updated = 0, skipped = 0;
  const byId = new Map(state.entries.map(e => [e.id, e]));
  const seenHeads = new Set(state.entries.map(e => e.type + ":" + fold(headOf(e))));
  const toWrite = [];
  for (const e of incoming) {
    const cur = byId.get(e.id);
    const head = e.type + ":" + fold(headOf(e));
    if (cur) {
      // same entry: newer edit wins
      if ((e.updatedAt || "") > (cur.updatedAt || "")) { toWrite.push(e); updated++; } else skipped++;
    } else if (seenHeads.has(head)) {
      skipped++; // same word already saved under a different id
    } else {
      toWrite.push(e); seenHeads.add(head); added++;
    }
  }
  if (toWrite.length) await DB.putMany(toWrite);
  state.entries = await DB.all();
  renderAll();
  const bad = list.length - incoming.length;
  return `Imported: ${added} new, ${updated} updated, ${skipped} unchanged/duplicate${bad ? `, ${bad} invalid skipped` : ""}.`;
}


/* =========================================================
   Install hints (Add to Home Screen)
   ========================================================= */
const SHARE_ICON = `<svg class="ios-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Share"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>`;
const Install = {
  deferred: null, // Android/desktop Chrome install prompt
  standalone() {
    try { return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; } catch { return false; }
  },
  platform() {
    const ua = navigator.userAgent || "";
    const iOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (iOS) {
      if (/FBAN|FBAV|FB_IAB|Instagram|Line\/|Snapchat|musical_ly|TikTok|LinkedInApp|GSA\//.test(ua)) return "ios-inapp";
      if (/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua)) return "ios-other";
      return "ios-safari";
    }
    if (/Android/.test(ua)) return "android";
    return "desktop";
  },
  // Steps for the current device; `compact` = banner wording.
  html(compact) {
    const p = this.platform();
    // On iPhone the Home Screen app has its own storage, separate from Safari (Android shares it).
    const keep = p.startsWith("ios") ? `<p class="note">Install first, then add your words — words saved in a Safari tab don't carry over to the Home Screen app (Settings → Export/Import can move them).</p>` : "";
    if (this.deferred) {
      return `<p>Install Wortfang as an app — it opens full-screen and works offline.</p>
        <div class="row"><button class="btn primary" data-install="go">Install app</button>${compact ? `<button class="btn" data-install="later">Not now</button>` : ""}</div>${keep}`;
    }
    if (p === "ios-safari") {
      return `<p>Tap ${SHARE_ICON} <b>Share</b> in Safari's toolbar, scroll down and choose <b>Add to Home Screen</b>, then <b>Add</b>. Open Wortfang from your Home Screen.</p>
        <p class="note">No “Add to Home Screen”? You're probably in a preview inside another app (e.g. WhatsApp) — tap the compass / “Open in Safari” button first.</p>
        ${keep}${compact ? `<div class="row"><button class="btn" data-install="later">Got it</button></div>` : ""}`;
    }
    if (p === "ios-other") {
      return `<p>Tap ${SHARE_ICON} <b>Share</b> (in the address bar or menu) and choose <b>Add to Home Screen</b>. If you don't see it, open this page in <b>Safari</b> and do it there.</p>
        ${keep}${compact ? `<div class="row"><button class="btn" data-install="later">Got it</button></div>` : ""}`;
    }
    if (p === "ios-inapp") {
      return `<p>You're in an app's built-in browser, which can't install apps. Tap <b>•••</b> and choose <b>Open in Safari</b> (or copy the link into Safari), then Share ${SHARE_ICON} → <b>Add to Home Screen</b>.</p>
        ${compact ? `<div class="row"><button class="btn" data-install="later">Got it</button></div>` : ""}`;
    }
    if (p === "android") {
      return `<p>Open your browser's menu <b>⋮</b> and choose <b>Install app</b> or <b>Add to Home screen</b>. Chrome works best.</p>
        ${keep}${compact ? `<div class="row"><button class="btn" data-install="later">Got it</button></div>` : ""}`;
    }
    return `<p>Open this page on your phone — iPhone: Safari → Share → <b>Add to Home Screen</b>; Android: Chrome menu ⋮ → <b>Install app</b>.${this.deferred ? "" : " In Chrome or Edge on a computer, use the install icon in the address bar."}</p>`;
  },
  dismissedRecently() {
    const t = Number(Settings.get("installHintDismissed", 0));
    return t && Date.now() - t < 7 * 24 * 3600 * 1000;
  },
  renderBanner() {
    const el = $("#installBanner");
    const show = !this.standalone() && !this.dismissedRecently() && (this.platform() !== "desktop" || this.deferred);
    el.hidden = !show;
    if (show) el.innerHTML = `<div class="install-card"><h3>Put Wortfang on your Home Screen</h3>${this.html(true)}</div>`;
  },
  settingsHTML() {
    if (this.standalone()) return `<p>Installed ✓ — you're using the Home Screen app.</p>`;
    return this.html(false);
  },
  async prompt() {
    if (!this.deferred) return;
    const ev = this.deferred;
    this.deferred = null;
    try { ev.prompt(); await ev.userChoice; } catch {}
    this.renderBanner();
  },
};
window.addEventListener("beforeinstallprompt", ev => {
  ev.preventDefault();
  Install.deferred = ev;
  Install.renderBanner();
});
window.addEventListener("appinstalled", () => { Install.deferred = null; Install.renderBanner(); toast("Installed — open Wortfang from your Home Screen"); });
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-install]"); if (!b) return;
  if (b.dataset.install === "go") Install.prompt();
  if (b.dataset.install === "later") { Settings.set("installHintDismissed", String(Date.now())); Install.renderBanner(); }
});


/* =========================================================
   Wiring
   ========================================================= */
$("#lookupForm").addEventListener("submit", ev => {
  ev.preventDefault();
  $("#lookupInput").blur();
  doLookup($("#lookupInput").value);
});
$("#lookupInput").addEventListener("focus", () => Dict.load());
$("#lookupStatus").addEventListener("click", onStatusClick);
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => switchTab(b.dataset.tab)));
$("#searchInput").addEventListener("input", ev => { state.q = ev.target.value; renderAll(); });
$("#viewToggle").addEventListener("click", openTableModal);
$("#modalClose").addEventListener("click", closeTableModal);
$("#tableModal").addEventListener("click", ev => { if (ev.target.id === "tableModal") closeTableModal(); });
document.querySelectorAll(".subtab").forEach(b => b.addEventListener("click", () => setModalSubtab(b.dataset.subtab)));
$("#modalSearch").addEventListener("input", renderModalTables);
$("#addToggle").addEventListener("click", () => {
  if (!$("#entryForm").hidden) closeForm();
  else openForm({ type: state.tab });
});
const entryForm = $("#entryForm");
entryForm.addEventListener("submit", submitForm);
entryForm.addEventListener("click", ev => {
  const art = ev.target.closest(".article-btn");
  if (art) {
    entryForm.querySelectorAll(".article-btn").forEach(x => x.classList.toggle("selected", x === art));
    return;
  }
  if (ev.target.closest("[data-cancel]")) closeForm();
});
document.body.addEventListener("click", ev => {
  const del = ev.target.closest("[data-del]");
  if (del) {
    armOrRun(del, "Delete?", () => deleteWithUndo(del.dataset.del));
    return;
  }
  const edit = ev.target.closest("[data-edit]");
  if (edit) {
    const e = state.entries.find(x => x.id === edit.dataset.edit);
    if (e) openForm(e);
  }
});
$("#btnSettings").addEventListener("click", openSettings);
$("#sheetClose").addEventListener("click", closeSheet);
$("#backdrop").addEventListener("click", ev => { if (ev.target.id === "backdrop") closeSheet(); });
document.addEventListener("keydown", ev => {
  if (ev.key !== "Escape") return;
  if (!$("#backdrop").hidden) closeSheet();
  else if (!$("#tableModal").hidden) closeTableModal();
});

Install.renderBanner();
load()
  .then(() => {
    // Warm up the dictionary in the background so the first lookup is instant.
    const warm = () => Dict.load();
    if ("requestIdleCallback" in window) requestIdleCallback(warm, { timeout: 3000 }); else setTimeout(warm, 1500);
  })
  .catch(err => {
    $("#emptyState").hidden = false;
    $("#emptyState").textContent = `Storage unavailable (${err.message || err}). Private Browsing blocks saving — open the app normally.`;
  });

if ("serviceWorker" in navigator && location.protocol !== "file:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
